name: Package and publish to CurseForge

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CurseForge configuration
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          test -n "$CURSEFORGE_PROJECT_ID" || { echo "Set the CURSEFORGE_PROJECT_ID repository variable."; exit 1; }
          test -n "$CF_API_TOKEN" || { echo "Set the CF_API_TOKEN repository secret."; exit 1; }

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        with:
          args: -p ${{ vars.CURSEFORGE_PROJECT_ID }} -g 1.60.1
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}